# Credential của Floci (không commit): kubectl -n external-secrets create secret generic floci-aws-creds \
#   --from-literal=access-key=<id> --from-literal=secret-access-key=<secret>
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: floci-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef: { name: floci-aws-creds, namespace: external-secrets, key: access-key }
          secretAccessKeySecretRef: { name: floci-aws-creds, namespace: external-secrets, key: secret-access-key }
