# KHÔNG nằm trong luồng sync (thư mục optional/ không được root-app đọc). Cần tài khoản + tunnel Cloudflare của bạn:
#   1. Zero Trust > Networks > Tunnels > tạo tunnel, copy token
#   2. kubectl create ns cloudflared
#      kubectl -n cloudflared create secret generic tunnel-token --from-literal=token=<TOKEN>
#   3. Trong dashboard, thêm Public Hostname -> service http://ingress-nginx-controller.ingress-nginx.svc:80
#   4. kubectl apply -f optional/cloudflared.yaml
#   5. ArgoCD/Grafana: đặt sau Cloudflare Access (Zero Trust > Access > Applications), không expose trực tiếp.
apiVersion: apps/v1
kind: Deployment
metadata: { name: cloudflared, namespace: cloudflared }
spec:
  replicas: 1
  selector: { matchLabels: { app: cloudflared } }
  template:
    metadata: { labels: { app: cloudflared } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532 }
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest   # nên ghim version/digest
          args: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom: { secretKeyRef: { name: tunnel-token, key: token } }
          livenessProbe: { httpGet: { path: /ready, port: 2000 }, initialDelaySeconds: 10 }
          resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { memory: 128Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
