apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "0" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.11.0
    helm:
      valuesObject:
        # Floci là AWS giả lập: trỏ Secrets Manager về endpoint của nó. Pod không resolve được tên container "floci"
        # (DNS nhúng của Docker) nên dùng IP container trong mạng compose: docker inspect platform-lab-floci-1. ArgoCD cũng
        # loại trừ EndpointSlice mặc định nên không dùng Service không selector. Trên AWS thật: bỏ extraEnv, dùng IRSA/Pod Identity.
        extraEnv:
          - { name: AWS_SECRETSMANAGER_ENDPOINT, value: "http://192.168.96.2:4566" }
        resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { memory: 192Mi } }
  destination: { server: https://kubernetes.default.svc, namespace: external-secrets }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
