apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-config
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "10" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source: { repoURL: https://github.com/Kuan-Platform-Lab/platform-gitops, targetRevision: main, path: platform-config }
  destination: { server: https://kubernetes.default.svc, namespace: external-secrets }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [SkipDryRunOnMissingResource=true]
